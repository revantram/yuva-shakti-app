<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border -->
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>

  <!-- Photo Studio Card with shadow -->
  <g filter="url(#dropShadow)">
    <rect x="36" y="38" width="120" height="96" rx="18" fill="url(#cardGrad)"/>
    <!-- Photo image area -->
    <rect x="44" y="46" width="104" height="80" rx="12" fill="#0f172a"/>
    <!-- Mountain landscape in photo -->
    <path d="M44 116 L76 78 L98 104 L118 84 L148 122 L44 122 Z" fill="#38bdf8" opacity="0.9"/>
    <path d="M78 116 L104 90 L126 112 L148 94 L148 122 L78 122 Z" fill="#0284c7" opacity="0.9"/>
    <!-- Sun / flash in photo -->
    <circle cx="70" cy="68" r="9" fill="#facc15"/>
  </g>

  <!-- Floating Camera badge overlay in bottom right -->
  <g filter="url(#dropShadow)">
    <circle cx="132" cy="132" r="34" fill="#0f172a"/>
    <circle cx="132" cy="132" r="32" fill="url(#lensGrad)"/>
    <circle cx="132" cy="132" r="23" fill="#0f172a"/>
    <circle cx="132" cy="132" r="17" fill="#1e293b"/>
    <circle cx="132" cy="132" r="11" fill="url(#lensGrad)"/>
    <circle cx="128" cy="128" r="4" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
