plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yuvashaktigroup.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.yuvashaktigroup.app"
        minSdk 24
        targetSdk 34
        versionCode 43
        versionName "4.5.7"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No external libraries needed - pure WebView + system APIs
}
