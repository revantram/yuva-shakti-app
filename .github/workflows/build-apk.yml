name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 🔐 Restore Permanent Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p secrets
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > secrets/release.keystore
            echo "✅ Release Keystore successfully restored from GitHub Repository Secrets."
          else
            echo "::error ::❌ KEYSTORE_BASE64 secret is not defined in GitHub Repository Secrets!"
            echo "Please go to: Repository Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name: KEYSTORE_BASE64"
            exit 1
          fi

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 🏗️ Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/secrets/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace

      - name: 🔍 Verify Release APK & Signature Fingerprint
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ ERROR: No release APK was generated!"
            exit 1
          fi
          echo "✅ Release APK found at: $APK_FILE"
          cp "$APK_FILE" YuvaShaktiGroup.apk
          cp "$APK_FILE" yuva-shakti.apk

          echo "==> 📜 Checking APK Signing Certificate & Fingerprint:"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs YuvaShaktiGroup.apk

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YuvaShaktiGroup-Release-APK
          path: |
            YuvaShaktiGroup.apk
            yuva-shakti.apk
          if-no-files-found: error

      - name: 🚀 Publish to GitHub Releases (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YuvaShaktiGroup.apk
            yuva-shakti.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
