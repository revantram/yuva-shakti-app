name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Licenses and Install SDK Platform 36
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Prepare Keystore and Environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating permanent keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=YuvaShakti,OU=Kuchera,O=BhatiParivar,L=Kuchera,ST=Rajasthan,C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f debug.keystore
            git commit -m "chore: persist permanent signing keystore" || true
            git push origin HEAD:main || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare Named Release APK
        run: |
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/yuva-shakti.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuva-shakti-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Yuva Shakti App (Latest Release)"
          body: |
            🚩 **युवा शक्ति ग्रुप (कुचेरा) - नवीनतम ऐप संस्करण (v2.6)** 🚩

            - 🌐 लाइव क्लाउड बहीखाता (Web Realtime Dashboard) ऐप का मुख्य दृश्य
            - 🔑 सदस्य कोड व एडमिन कोड (992942) से सुरक्षित ऑटो-लॉगिन
            - ⚡ रीयल-टाइम ऑनलाइन उपस्थिति (● ऑनलाइन / ○ ऑफ़लाइन)
            - 💳 PhonePe / Google Pay / UPI डायरेक्ट पेमेंट व QR कोड
            - 🚨 आपातकालीन सायरन तगादा ब्रॉडकास्ट व साउंड अलर्ट
            - 📊 पारदर्शी अमावस्या मासिक अंशदान तालिका व फ़िल्टर
          files: app/build/outputs/apk/debug/yuva-shakti.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
