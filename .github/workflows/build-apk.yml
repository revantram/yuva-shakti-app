name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Licenses and Install SDK Platform 36
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Prepare Keystore and Environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating permanent keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=YuvaShakti,OU=Kuchera,O=BhatiParivar,L=Kuchera,ST=Rajasthan,C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f debug.keystore
            git commit -m "chore: persist permanent signing keystore" || true
            git push origin HEAD:main || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare Named Release APK
        run: |
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/yuva-shakti.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuva-shakti-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Yuva Shakti App v3.0 (Latest Release)"
          body: |
            🚩 **युवा शक्ति ग्रुप (कुचेरा) - नया संस्करण (v3.0)** 🚩

            - ✨ नया iOS लिक्विड ग्लासमोर्फिज्म इंटरफ़ेस एवं फ्लोटिंग बॉटम डॉक
            - 🟢 लाइव एक्टिव मेंबर्स काउंटर (Firebase Realtime Database)
            - 🧾 डिजिटल रसीद एवं 6-माह का इतिहास + WhatsApp 1-क्लिक शेयरिंग
            - 🔔 2 दिन पहले ऑटोमैटिक WhatsApp अमावस्या रिमाइंडर
            - 🤝 सहायता ऋण आवेदन व लाइव वोटिंग
            - 🖼️ फ़ोटो गैलरी व इमेज लाइटबॉक्स
            - 💳 PhonePe / Google Pay / UPI डायरेक्ट पेमेंट व QR कोड
          files: app/build/outputs/apk/debug/yuva-shakti.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases (v3.0)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0
          name: "Yuva Shakti App v3.0 (Official Release)"
          body: |
            🚩 **युवा शक्ति ग्रुप (कुचेरा) - आधिकारिक v3.0 रिलीज़** 🚩

            - ✨ नया iOS लिक्विड ग्लासमोर्फिज्म इंटरफ़ेस एवं फ्लोटिंग बॉटम डॉक
            - 🟢 लाइव एक्टिव मेंबर्स काउंटर (Firebase Realtime Database)
            - 🧾 डिजिटल रसीद एवं 6-माह का इतिहास + WhatsApp 1-क्लिक शेयरिंग
            - 🔔 2 दिन पहले ऑटोमैटिक WhatsApp अमावस्या रिमाइंडर
            - 🤝 सहायता ऋण आवेदन व लाइव वोटिंग
            - 🖼️ फ़ोटो गैलरी व इमेज लाइटबॉक्स
            - 💳 PhonePe / Google Pay / UPI डायरेक्ट पेमेंट व QR कोड
          files: app/build/outputs/apk/debug/yuva-shakti.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
