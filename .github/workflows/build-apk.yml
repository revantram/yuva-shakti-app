name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Licenses and Install SDK Platform 36
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Prepare Keystore and Environment
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare Named Release APK
        run: |
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/yuva-shakti.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuva-shakti-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Yuva Shakti App (Latest Release)"
          body: |
            🚩 **युवा शक्ति ग्रुप (कुचेरा) - नवीनतम ऐप संस्करण** 🚩

            - 📁 गूगल ड्राइव (Google Drive) बैकअप सुविधा
            - 💎 पारदर्शी और आधुनिक ट्रांसलूसेंट थीम (Glassmorphism)
            - 🌙 डार्क मोड में शत-प्रतिशत स्पष्ट टेक्स्ट
            - 💳 चार कोनों वाला जमा राशि व फ़ोनपे डायरेक्ट पे बटन
            - 📢 आपातकालीन सायरन व अलर्ट सेटिंग्स केवल एडमिन के लिए
          files: app/build/outputs/apk/debug/yuva-shakti.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
