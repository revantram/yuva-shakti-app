name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create simple webview app structure
      run: |
        mkdir -p myapp/app/src/main/assets
        cp -r *.html *.js *.css myapp/app/src/main/assets/ 2>/dev/null || true
        echo "Files prepared successfully"

    - name: Package dummy debug APK
      run: |
        mkdir -p output
        zip -r output/app-debug.apk .

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: output/app-debug.apk
        
