name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create App Package Structure
      run: |
        mkdir -p myapp/app/src/main/assets
        cp -r *.html *.js *.css myapp/app/src/main/assets/ 2>/dev/null || true
        cp -r assets/ myapp/app/src/main/assets/ 2>/dev/null || true
        cd myapp
        zip -r ../app-debug.apk .
        cd ..

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app-debug.apk
        
